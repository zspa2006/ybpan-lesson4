<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#091410">
  <title>ybpan的前端网页作品集</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <img class="brand-mark" src="Pictures/brand-mark.png" alt="" width="16" height="16">
      <h1>ybpan的前端网页作品集</h1>
      <p>这是我的前端网页作品，点击跳转到具体的页面！</p>
    </header>
    <section id="meals" class="meals-container" aria-label="前端网页作品">
      <a class="meal" href="https://ybpan-lesson2.vercel.app/">
        <img class="preview" src="Pictures/quiz.png" alt="Quiz Time 问答页面预览">
        <div class="meal-info"><h2>Quiz Time</h2><span class="meal-category">Quiz</span></div>
      </a>
      <a class="meal" href="https://ybpan-lesson1.vercel.app/">
        <img class="preview" src="Pictures/register.png" alt="Register Form 注册表单预览">
        <div class="meal-info"><h2>Register Form</h2><span class="meal-category">Register</span></div>
      </a>
      <a class="meal" href="https://ybpan-lesson3.vercel.app/">
        <img class="preview" src="Pictures/recipe.png" alt="Recipe Finder 食谱搜索页面预览">
        <div class="meal-info"><h2>Recipe Finder</h2><span class="meal-category">Recipe</span></div>
      </a>
    </section>
  </main>
</body>
</html>
